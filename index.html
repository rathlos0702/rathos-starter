<title>RathOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --surface-2:#ECEBE6;
  --ink:#1D1D1B; --ink-2:#686763; --line:#E3E2DD; --line-soft:#ECEBE6;
  --done:#9A9994;
  --accent:#A66A12; --accent-ink:#FFFFFF; --accent-soft:#F3E8D4; --tint:#F3E8D4;
  --gold:#A66A12; --gold-soft:#F3E8D4;
  --green:#4F7350; --green-soft:#E2EBDF;
  --person-svea:#C0603B; --person-jan:#2E7C83;
  --shadow:0 1px 2px rgba(29,29,27,.06),0 4px 12px rgba(29,29,27,.05);
  --shadow-sheet:0 18px 48px rgba(34,32,29,.16);
}
html[data-bereich="essen"]{--accent:#4F7350;--accent-soft:#E2EBDF;--tint:#E2EBDF}
html[data-bereich="org"]{--accent:#3F5F82;--accent-soft:#E0E7EF;--tint:#E0E7EF}
html[data-bereich="kinder"]{--accent:#7E4E78;--accent-soft:#EEE2EC;--tint:#EEE2EC}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161615; --surface:#262624; --surface-2:#2C2C29;
    --ink:#EDEDEA; --ink-2:#A3A29D; --line:#2C2C29; --line-soft:#242422;
    --done:#7A7974;
    --accent:#E0B470; --accent-ink:#161615; --accent-soft:#3A2E1C; --tint:#3A2E1C;
    --gold:#E0B470; --gold-soft:#3A2E1C;
    --green:#9CC29B; --green-soft:#26312A;
    --person-svea:#DE8A68; --person-jan:#5FB3B9;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);
    --shadow-sheet:0 18px 48px rgba(0,0,0,.5);
  }
  html[data-bereich="essen"]{--accent:#9CC29B;--accent-soft:#26312A;--tint:#26312A}
  html[data-bereich="org"]{--accent:#8FB0D3;--accent-soft:#24303D;--tint:#24303D}
  html[data-bereich="kinder"]{--accent:#C99BC3;--accent-soft:#35263A;--tint:#35263A}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  height:100dvh;display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.serif{font-family:'Newsreader',Georgia,serif;font-weight:500}

/* ── Header ── */
.hdr{padding:calc(18px + env(safe-area-inset-top)) 16px 16px;flex-shrink:0;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.menu-btn{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;background:none}
.menu-btn svg{width:24px;height:24px}
.menu-btn svg path{stroke:currentColor}
.menu-btn:active{background:var(--surface-2)}
.hdr-t{font-size:26px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.hdr-t.small{font-size:23px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex-shrink:0;transition:background .3s;margin-top:3px;cursor:pointer}
.sync-dot.busy{background:var(--gold);animation:pulse 1s ease-in-out infinite}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:#C23A3A}
@keyframes pulse{50%{opacity:.35}}
.week-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:100px;
  padding:7px 12px 7px 14px;font-size:13px;font-weight:600;color:var(--ink);
  box-shadow:var(--shadow);white-space:nowrap;
}
.week-pill .chev{color:var(--ink-2);font-size:11px}
.week-pill .snack-mark{color:var(--gold);font-weight:700}

/* ── Panes ── */
.pane{flex:1;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
.pad{padding:16px 16px 24px}

/* ── Day strip ── */
.day-strip{display:flex;gap:4px;padding:6px 16px 12px;justify-content:space-between;flex-shrink:0}
.day-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 2px;flex:1;position:relative}
.day-lbl{font-size:11px;font-weight:500;color:var(--ink-2)}
.day-btn.on .day-lbl{color:var(--accent);font-weight:700}
.day-circle{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--ink);
  transition:all .15s;
}
.day-btn.on .day-circle{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.06)}
.buy-dot{position:absolute;bottom:-2px;width:6px;height:6px;border-radius:50%;background:var(--green);opacity:0;transition:opacity .2s}
.day-btn.bought .buy-dot{opacity:1}

/* ── Day detail ── */
.day-detail{padding:4px 16px 24px}
.day-name-row{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 14px}
.day-name{font-size:28px;font-weight:600;letter-spacing:.01em}
.genuss-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--gold-soft);color:var(--gold);padding:5px 11px;border-radius:100px}

.meal-card{
  background:var(--surface);border-radius:16px;margin-bottom:10px;
  box-shadow:var(--shadow);border:1px solid var(--line-soft);
  border-left:3px solid transparent;
  transition:border-color .15s, opacity .1s;
  overflow:hidden;
}
.meal-card.sel{border-left-color:var(--accent)}
.meal-card:active{opacity:.75}
.meal-inner{padding:13px 14px 13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.meal-left{flex:1;min-width:0}
.meal-label{font-size:10px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px}
.meal-name{font-size:16px;font-weight:600;line-height:1.3}
.meal-sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.meal-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.rez-btn{font-size:13px;color:var(--accent);font-weight:600;padding:6px 2px}
.check-circle{
  width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;font-size:0;
}
.meal-card.sel .check-circle{background:var(--accent);border-color:var(--accent)}
.meal-card.sel .check-circle::after{content:'✓';color:var(--accent-ink);font-size:13px;font-weight:700}

.buy-btn{
  width:100%;margin-top:14px;padding:14px 16px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line-soft);
  box-shadow:var(--shadow);display:flex;align-items:center;gap:11px;text-align:left;
  transition:background .15s;
}
.buy-btn.done{background:var(--green-soft);border-color:transparent}
.buy-icon{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:0;transition:all .15s;
}
.buy-btn.done .buy-icon{background:var(--green);border-color:var(--green)}
.buy-btn.done .buy-icon::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.buy-txt{flex:1}
.buy-t1{font-size:15px;font-weight:600}
.buy-btn.done .buy-t1{color:var(--green)}
.buy-t2{font-size:12px;color:var(--ink-2);margin-top:1px}

/* ── Rezepte tab ── */
.sec-lbl{font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.09em;margin:0 0 9px}
.oats-card{
  background:linear-gradient(135deg,var(--accent) 0%,#1E4258 100%);
  border-radius:16px;padding:16px;margin-bottom:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);
}
@media (prefers-color-scheme: dark){.oats-card{background:linear-gradient(135deg,#3A6280 0%,#243642 100%)}}
.oats-name{font-size:17px;font-weight:600;color:#fff}
.oats-sub{font-size:12.5px;color:rgba(255,255,255,.75);margin-top:3px}
.oats-arr{color:rgba(255,255,255,.6);font-size:20px}
.woche-list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line-soft)}
.rz-row{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.rz-row:last-child{border-bottom:none}
.rz-row:active{background:var(--surface-2)}
.rz-drag{padding:0;transition:transform .18s ease}
.rz-drag.rz-lift{transition:none;z-index:5;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.18);background:var(--surface);border-radius:12px}
.rz-handle{flex-shrink:0;width:42px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--ink-2);touch-action:none;cursor:grab}
.rz-handle svg{width:22px;height:22px}
.rz-handle:active{color:var(--accent)}
.rz-body{flex:1;display:flex;align-items:center;min-width:0;padding:13px 14px 13px 0;cursor:pointer}
.rz-day-badge{
  width:40px;height:40px;border-radius:12px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;margin-right:12px;flex-shrink:0;
  font-size:11px;font-weight:700;color:var(--ink-2);
}
.rz-day-badge.gn{background:var(--gold-soft);color:var(--gold)}
.rz-info{flex:1;min-width:0}
.rz-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rz-meta{font-size:12px;color:var(--ink-2);margin-top:2px}
.rz-arr{color:var(--ink-2);font-size:19px;margin-left:8px;flex-shrink:0}
.prep-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:middle}
.prep-meta{color:var(--accent)}

/* ── Einkauf ── */
.ek-count{padding:16px 16px 0;display:flex;justify-content:space-between;align-items:baseline}
.ek-count-n{font-size:15px;font-weight:700}
.ek-count-s{font-size:13px;color:var(--ink-2)}
.kat-sec{margin-bottom:18px}
.ek-list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line-soft)}
.ek-item{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line-soft);gap:12px;cursor:pointer}
.ek-item:last-child{border-bottom:none}
.ek-chk{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:0}
.ek-item.done .ek-chk{background:var(--ink-2);border-color:var(--ink-2)}
.ek-item.done .ek-chk::after{content:'✓';color:var(--surface);font-size:12px;font-weight:700}
.ek-item.done .ek-name{text-decoration:line-through;color:var(--ink-2)}
.ek-item.done .ek-menge{color:var(--line)}
.ek-info{margin-left:10px;font-size:16px;color:var(--ink-2);opacity:.55;flex-shrink:0;padding:2px 4px;background:none;border:none}
.ek-item.done .ek-info{opacity:.3}
.ek-dayhd{display:flex;align-items:center;padding:0 4px 8px;gap:0}
.ek-dayhd-day{flex:1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.ek-dayhd-ic{width:46px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.ek-dayhd-ic svg{width:17px;height:17px}
.ek-dayrow{display:flex;align-items:center;padding:11px 4px 11px 15px;border-bottom:1px solid var(--line-soft)}
.ek-dayrow:last-child{border-bottom:none}
.ek-dayrow.erledigt .ek-dayinfo{opacity:.4}
.ek-dayinfo{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.ek-daybtn{width:46px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:none;border-radius:10px;color:var(--line)}
.ek-daybtn svg{width:23px;height:23px}
.ek-daybtn path{stroke:currentColor}
.ek-daybtn.cart.on{color:var(--accent)}
.ek-daybtn.check.on{color:var(--green)}
.ek-daybtn:active{background:var(--surface-2)}
.ek-name{font-size:15px;flex:1}
.ek-menge{font-size:14px;color:var(--ink-2);font-weight:500;flex-shrink:0;font-variant-numeric:tabular-nums}
.btn-copy{
  width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:600;text-align:center;
  background:var(--accent);color:var(--accent-ink);margin-top:6px;
}
.btn-copy:disabled{background:var(--line);color:var(--ink-2)}
.empty-hint{text-align:center;padding:48px 24px;color:var(--ink-2);font-size:15px;line-height:1.5}

/* ── Bottom tabs ── */
.menu-item{width:100%;padding:15px 16px;border-radius:13px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:8px}

/* Startseite */
.st-greet{font-size:27px;font-weight:600;margin-top:4px}
.st-date{font-size:14px;color:var(--ink-2);margin-bottom:18px;text-transform:capitalize}
.st-card{background:var(--surface);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line-soft);cursor:pointer}
.st-card:active{opacity:.75}
.st-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.st-card-lbl{font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
.st-arr{color:var(--ink-2);font-size:19px}
.st-meal-name{font-size:19px;font-weight:600;line-height:1.25}
.st-meal-meta{font-size:13px;color:var(--ink-2);margin-top:4px}
.st-prep{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--accent);margin-top:7px}
.st-prep-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.st-daygrp{margin-top:10px}
.st-daygrp:first-of-type{margin-top:0}
.st-daylbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:4px}
.st-todo-bar{width:4px;height:18px;border-radius:2px;flex-shrink:0}
.st-empty{font-size:14px;color:var(--ink-2)}
.st-wp{display:flex;align-items:center;gap:9px;padding:5px 0}
.st-wp-bar{width:3px;height:26px;border-radius:2px;flex-shrink:0}
.st-wp-t{font-size:15px;font-weight:600;flex:1}
.st-wp-m{font-size:12.5px;color:var(--ink-2)}
.st-todo-count{font-size:15px;font-weight:700;margin-bottom:8px}
.st-todo{display:flex;align-items:center;gap:9px;padding:4px 0}
.st-todo-prio{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-todo-prio.p1{background:#C23A3A}.st-todo-prio.p2{background:var(--gold)}.st-todo-prio.p3{background:var(--ink-2)}
.st-todo-t{font-size:14.5px;flex:1}
.st-todo-p{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-more{font-size:13px;color:var(--accent);margin-top:6px;font-weight:600}
.st-quick{background:var(--gold-soft);border-color:transparent}
.st-quick-n{font-size:15px;font-weight:700}

/* Beikost-Tracker */
.bk-searchwrap{position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);}
.bk-search{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-family:inherit}
.bk-results{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.bk-res{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.bk-res:last-child{border-bottom:none}
.bk-res:active{background:var(--surface-2)}
.bk-res-n{font-size:15px;font-weight:600}
.bk-res-c{font-size:13px;color:var(--accent);font-weight:600}
.bk-res-add{background:var(--accent-soft)}
.bk-progress{margin-bottom:20px}
.bk-progress-n{font-size:14px;font-weight:700;margin-bottom:7px}
.bk-bar{height:8px;background:var(--line-soft);border-radius:100px;overflow:hidden}
.bk-bar-fill{height:100%;background:var(--accent);border-radius:100px;transition:width .3s}
.bk-kat{margin-bottom:18px}
.bk-kat-hd{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:8px;padding:0 2px}
.bk-kat-n{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:1px 8px}
.bk-item{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--surface);border:1px solid var(--line-soft);border-radius:11px;margin-bottom:6px}
.bk-item.done{border-color:var(--accent-soft)}
.bk-item-n{font-size:15px;font-weight:500}
.bk-item.done .bk-item-n{font-weight:600}
.bk-alg{color:#C0533F;font-size:13px}
.bk-dots{display:flex;gap:5px}
.bk-dot{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.bk-dot.on{background:var(--accent);border-color:var(--accent)}

/* Kinder-Merkzettel */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px 15px;text-align:left;box-shadow:var(--shadow)}
.kpi-card:active{opacity:.7}
.kpi-lbl{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.kpi-val{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.kpi-val.empty{color:var(--line);font-weight:400}
.kl-sec{margin-bottom:22px}
.kl-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 2px}
.kl-hd>span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.kl-add{width:28px;height:28px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
.kl-add:active{background:var(--accent-soft)}
.kl-empty{font-size:14px;color:var(--line);padding:2px 2px 4px}
.kl-item{position:relative;border-radius:11px;overflow:hidden;margin-bottom:6px}
.kl-item::before{content:"";position:absolute;inset:0;background:var(--line)}
.kl-item.sw-del::before{content:"Löschen";background:#C0533F;color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-size:13px;font-weight:700}
.kl-item-inner{position:relative;background:var(--surface);border:1px solid var(--line-soft);border-radius:11px;padding:12px 14px;font-size:15px;font-weight:500}

/* Wochenplanung */
.wp-weeknav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wp-arrow{width:38px;height:38px;border-radius:10px;background:var(--bg);font-size:22px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.wp-weeklbl{font-size:16px;font-weight:700}
.wp-day{margin-bottom:14px}
.wp-day-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;padding:0 2px}
.wp-day-name{font-size:15px;font-weight:700}
.wp-day.today .wp-day-name{color:var(--accent)}
.wp-day-r{display:flex;align-items:center;gap:10px}
.wp-day-date{font-size:13px;color:var(--ink-2)}
.wp-day-add{width:26px;height:26px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.wp-day-add:active{background:var(--accent-soft)}
.wp-empty{font-size:14px;color:var(--line);padding:2px 2px 4px}
.wp-entry{background:var(--surface);border-radius:12px;padding:10px 13px;margin-bottom:7px;box-shadow:var(--shadow);border:1px solid var(--line-soft);border-left:3px solid var(--ink-2);cursor:pointer}
.wp-entry:active{opacity:.7}
.wp-entry-main{display:flex;align-items:center;gap:8px}
.wp-entry-titel{font-size:15px;font-weight:600}
.wp-entry-meta{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.wp-input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
.wp-person-row{display:flex;flex-wrap:wrap;gap:7px}
.wp-person{padding:9px 15px;border-radius:100px;border:1.5px solid var(--line);background:transparent;color:var(--ink-2);font-size:14px;font-weight:600}
.wp-daysel{display:flex;gap:5px}
.wp-dayb{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:13px;font-weight:600}
.wp-dayb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wp-dayb.dis{opacity:.3}
.wp-checkrow{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;font-size:15px;font-weight:500}
.wp-check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);flex-shrink:0}
.wp-check.on{background:var(--accent);border-color:var(--accent)}
.wp-check.on::after{content:'✓';color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;height:100%}

/* To-dos */
.td-sugtag{font-size:12px;color:var(--gold);margin-top:7px;font-weight:600}
.td-filterbar{display:flex;gap:7px;padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.td-fchip{white-space:nowrap;padding:7px 13px;border-radius:100px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.td-fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.td-fchip.clear{color:var(--ink-2);border-style:dashed;margin-left:auto}
.td-fcar{font-size:9px;opacity:.7}
.td-fchip.open .td-fcar{transform:rotate(180deg)}
.td-dropdown{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.td-dopt{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;background:transparent;font-size:15px;color:var(--ink);font-weight:500;text-align:left}
.td-dopt.on{background:var(--accent-soft)}
.td-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.td-prio-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.td-prio-dot.p1{background:#C0533F}.td-prio-dot.p2{background:var(--gold)}.td-prio-dot.p3{background:var(--ink-2)}
.td-dcheck{margin-left:auto;color:var(--accent);font-weight:700}
.td-add{width:100%;padding:12px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:600;margin-bottom:18px}
.td-add:active{opacity:.85}
.td-group{margin-bottom:16px}
.td-group-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px}
.td-group-hd>span:first-child{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.td-group-n{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:1px 7px}
.td-card{margin-bottom:7px;position:relative;border-radius:12px;overflow:hidden}
.td-card::before{content:"";position:absolute;inset:0;border-radius:12px;background:var(--line);display:flex}
.td-card.sw-back::before{background:var(--ink-2)}
.td-card.sw-adv::before{background:var(--green)}
.td-card::after{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:13px;font-weight:700;color:#fff;opacity:0;transition:opacity .1s}
.td-card.sw-back::after{content:"‹ Zurück";right:16px;opacity:1}
.td-card.sw-adv::after{content:"Weiter ›";left:16px;opacity:1}
.td-card-inner{position:relative;background:var(--surface);border:1px solid var(--line-soft);border-left:6px solid var(--line);border-radius:12px;padding:11px 13px 11px 14px;cursor:pointer;box-shadow:var(--shadow)}
.td-text{font-size:15px;font-weight:600;line-height:1.3}
.td-card-meta{display:flex;align-items:center;gap:8px;margin-top:5px}
.td-timing{font-size:12px;color:var(--ink-2);font-weight:600}
.td-hasnote{font-size:11px;color:var(--ink-2);background:var(--bg);border-radius:100px;padding:1px 8px;font-weight:600}
.td-undo{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--ink);color:var(--surface);border-radius:12px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(0,0,0,.25);transform:translateY(calc(100% + 90px));opacity:0;transition:transform .25s,opacity .2s;z-index:40;max-width:448px;margin:0 auto;pointer-events:none}
.td-undo.on{transform:translateY(0);opacity:1;pointer-events:auto}
.td-undo button{color:var(--gold);font-weight:700;font-size:14px;background:none}
.konfetti-box{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.konfetti-box span{position:absolute;top:0;left:0;will-change:transform,opacity}
.menu-brand{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.menu-settings{width:100%;margin-top:6px;padding:14px 16px;border-radius:13px;background:transparent;border:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;color:var(--ink-2)}
.menu-gear{font-size:17px}
.menu-syncdot{width:8px;height:8px;border-radius:50%;margin-left:auto}
.menu-syncdot.ok{background:var(--green)}
.menu-syncdot.off{background:#C0533F}
.st-sync{width:100%;margin-top:4px;padding:11px 14px;border-radius:12px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.st-sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-sync.ok .st-sync-dot{background:var(--green)}
.st-sync.warn{background:#FBEDEA;border-color:transparent;color:#B24734}
.st-sync.warn .st-sync-dot{background:#C0533F}
@media (prefers-color-scheme: dark){.st-sync.warn{background:#3A241F;color:#E4998A}}

.menu-item.on{background:var(--accent-soft);color:var(--accent)}
.menu-check{color:var(--accent);font-weight:700}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:14px 0 15px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-2)}
.tab.on{color:var(--accent)}
.tab svg{width:30px;height:30px}
.tab svg *{stroke:currentColor}
.tab svg [data-f]{fill:currentColor;stroke:none}
.tab-lbl{font-size:11px;font-weight:600}
.tab.on .tab-lbl{font-weight:700}

/* ── Sheets ── */
.sheet-overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,15,10,.45);opacity:0;transition:opacity .22s}
.sheet-body{
  position:relative;background:var(--surface);border-radius:22px 22px 0 0;
  max-height:88vh;overflow-y:auto;z-index:1;box-shadow:var(--shadow-sheet);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,.35,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet-overlay.on{pointer-events:auto}
.sheet-overlay.on .sheet-bg{opacity:1}
.sheet-overlay.on .sheet-body{transform:translateY(0)}
.sheet-handle{display:flex;justify-content:center;padding:11px 0 3px}
.sheet-handle-bar{width:38px;height:4px;border-radius:2px;background:var(--line)}
.sheet-hdr{padding:6px 20px 15px;border-bottom:1px solid var(--line-soft)}
.sheet-hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-title{font-size:21px;font-weight:600;line-height:1.25;flex:1}
.sheet-kcal{font-size:13px;color:var(--ink-2);margin-top:4px}
.sheet-close{

"Jerusalem Teller":{b:3,zu:ZU.jer,kcal:520,prot:45,st:["Hähnchenbrust in Streifen schneiden, mit Paprika edelsüß, Kreuzkümmel, Curry, Knoblauch und Olivenöl mindestens 20 Min. marinieren.","Paprika in breite Streifen schneiden und in sehr heißer Grillpfanne ohne Fett schwarz-fleckig rösten.","Hähnchen in derselben Pfanne scharf anbraten bis goldbraune Kruste entsteht.","Hummus großzügig auf Teller streichen, Hähnchen und Paprika drauf, Koriander zupfen. Mit warmem Pita servieren."]},
"Udon mit Curry und Lachs":{b:3,zu:ZU.udon,kcal:480,prot:38,st:["Lachs auftauen, trocken tupfen, in Würfel schneiden. Brokkoli in Röschen, Möhren schräg in Scheiben.","Currypaste 1–2 Min. anrösten. Ingwer und Knoblauch kurz mitrösten.","Kokosmilch und 150ml Wasser angießen, Sojasoße dazu. Gemüse in den Sud, 4 Min. köcheln.","Lachswürfel einlegen, Hitze reduzieren, 4–5 Min. ziehen lassen.","Udon-Nudeln kochen. In Schalen anrichten, Sesamöl drüber."]},
"Hähnchen-Shawarma-Bowl":{b:3,zu:ZU.shaw,kcal:510,prot:48,hinweise:["Der Joghurt ist für die Soße, nicht für die Marinade."],st:["Alle Gewürze mit Olivenöl und Knoblauch zu Marinade mischen. Hähnchen mindestens 30 Min. einlegen.","Basmatireis waschen und kochen.","Hähnchen in sehr heißer Pfanne scharf anbraten — Gewürze sollen karamellisieren und eine dunkle Kruste bilden.","Gurke und Tomaten würfeln. Joghurt mit Knoblauch, Zitronensaft und Salz zu Soße rühren.","Bowls aufbauen: Reis, Hähnchen, Gemüse, Joghurt-Soße."]},
"Lachs aus dem Ofen mit Süßkartoffeln":{b:3,zu:ZU.lsue,kcal:490,prot:42,st:["Ofen auf 200°C. Süßkartoffeln in Wedges schneiden, mit Olivenöl und Paprika edelsüß auf Blech.","15 Min. vorrösten bis sie Farbe bekommen.","Lachs auf das Blech legen, würzen. Weitere 12–15 Min. backen.","Joghurt-Dip aus Joghurt, Dill, Knoblauch und Zitronensaft rühren."]},
"Nudeln mit Salbei und Tomaten":{b:3,zu:ZU.salb,kcal:560,prot:38,st:["Pasta al dente kochen, Kochwasser aufheben.","Hähnchenstreifen scharf anbraten bis goldbraun. Herausnehmen.","Butter in die Pfanne, Salbeiblätter einzeln einlegen und knusprig frittieren. Knoblauch kurz mitrösten.","Kirschtomaten halbiert dazugeben, 3–4 Min. zerfallen lassen.","Pasta und Hähnchen unterheben, Kochwasser dazugeben. Parmesan drüber."]},
"Nudeln mit Tomatensauce, Speck & Mozzarella":{b:3,zu:ZU.tsp,kcal:580,prot:35,st:["Speck in Würfel schneiden, langsam ausbraten bis knusprig.","Knoblauch mitrösten, mit passierten Tomaten ablöschen. 15 Min. köcheln.","Pasta al dente kochen. Mit Kochwasser zur Sauce geben.","Mozzarella drauf, Basilikum zupfen, Parmesan reiben."]},
"Frikadellen mit Kartoffelbrei":{b:4,zu:ZU.frikZU,beilage:true,beilageA:"Kartoffelbrei",beilageB:"Kohlrabi-Bratkartoffeln",zuK:ZU.frikK,zuA:ZU.frikA,zuB:ZU.frikB,kcal:470,prot:40,
stK:["Möhren fein raspeln, Petersilie fein hacken. Hackfleisch mit Quark, Haferflocken, Senf, Möhren, Petersilie, Salz und Pfeffer verkneten. 8 Frikadellen formen (können bis zum Braten kalt stehen).","Erst die Beilage fertig garen (siehe unten), dann die Frikadellen: in beschichteter Pfanne bei mittlerer Hitze 6–7 Min. pro Seite braten. So sind sie beim Servieren heiß."],
stA:["Kartoffeln schälen, in Stücke schneiden, ca. 20 Min. weich kochen, abgießen und kurz ausdämpfen.","Stampfen, Sahne und Butter heiß einrühren. Mit Salz, Muskat, Pfeffer abschmecken — cremig und glatt. Zugedeckt warm stellen, während die Frikadellen braten."],
stB:["Kohlrabi und Kartoffeln in 1 cm Würfel schneiden. Öl in einer großen Pfanne erhitzen, Würfel hineingeben, einen kleinen Schuss Wasser dazu und zugedeckt 8 Min. andünsten.","Deckel ab, Zwiebel dazu, offen ca. 8–10 Min. goldbraun braten. Mit Salz, Pfeffer, Petersilie abschmecken. Warm stellen, dann die Frikadellen braten."]},
"Garnelen-Pfanne mit Ciabatta":{b:3,zu:ZU.garn,kcal:440,prot:38,st:["Garnelen auftauen, sehr gut trocken tupfen.","Öl auf höchste Stufe erhitzen. Garnelen 90 Sek. nicht bewegen, wenden, 60 Sek. Herausnehmen.","Knoblauch und frische Chili (entkernt, fein gehackt) ins Öl, Kirschtomaten halbiert dazu, Butter einrühren.","Garnelen zurück, mit Zitronensaft und Petersilie schwenken.","Ciabatta toasten und dazu servieren."]},
"Thunfisch-Pasta mit Tomatensauce":{b:3,zu:ZU.thup,kcal:500,prot:42,st:["Zwiebel fein würfeln, in Olivenöl glasig anschwitzen. Knoblauch in Scheiben dazu, kurz mitrösten.","Sardellenpaste einrühren, kurz auflösen lassen, mit passierten Tomaten ablöschen. 12 Min. köcheln.","Pasta al dente kochen. Thunfisch abtropfen und grob in die Sauce einrühren.","Pasta mit Kochwasser zur Sauce. Basilikum zupfen, Parmesan drüber."]},
"Teriyaki-Lachs mit Reis und Brokkoli":{b:3,zu:ZU.teri,kcal:490,prot:40,st:["Reis aufsetzen und kochen — er soll fertig sein, bevor der Lachs in die Pfanne kommt.","Teriyaki-Glasur anrühren: Sojasoße, Honig, geriebenen Ingwer, Knoblauch, Reisessig. Die Menge reicht bewusst großzügig, damit auch Brokkoli und Reis etwas abbekommen.","Brokkoli in wenig Wasser oder in der Pfanne 4–5 Min. bissfest garen, einen Schuss Glasur drüber, warm stellen.","Lachs in Sesamöl auf der Hautseite 4 Min. anbraten bis die Haut kross ist. Wenden.","Die Hälfte der Glasur über den Lachs — sie karamellisiert sofort. 2–3 Min. fertig garen.","Alles anrichten, restliche Glasur über Lachs, Brokkoli und Reis träufeln."]},
"Pulled Chicken Wraps":{b:3,zu:ZU.pull,kcal:540,prot:46,st:["Marinade: geräuchertes Paprikapulver, Paprika edelsüß, Kreuzkümmel, Knoblauch, Honig und Sojasoße verrühren. Hähnchen mindestens 30 Min. marinieren.","Hähnchen in Hühnerbrühe mit Lorbeer und 2 Knoblauchzehen bei niedriger Hitze 20–25 Min. pochieren. Zerzupfen, etwas Pochierflüssigkeit drüber.","Zucchini, Aubergine und Paprika in Streifen schneiden, mit Olivenöl in einer heißen Pfanne oder Grillpfanne 8–10 Min. rösten bis sie Farbe bekommen.","Joghurt-Soße: Joghurt mit geräuchertem Paprika, Knoblauch, Zitronensaft, Salz verrühren.","Wraps kurz anwärmen. Belegen: Joghurt-Soße, Pulled Chicken, Grillgemüse, zerbröselter Schafskäse. Fest einrollen."]},
"Blumenkohl/Brokkoli/Kartoffelauflauf":{b:3,zu:ZU.aufla,kcal:520,prot:30,st:["Ofen auf 200°C. Kartoffeln in dünne Scheiben hobeln, Gemüse in Röschen. Kartoffeln 6 Min. in Salzwasser kochen, Blumenkohl und Brokkoli die letzten 3 Min. dazu. Abgießen und sehr gut abtropfen lassen — Restwasser macht die Soße wässrig.","Putenscheiben in Streifen schneiden, würzen, in heißer Pfanne 4–5 Min. anbraten bis sie Farbe bekommen.","Béchamel: Butter schmelzen, Mehl einrühren, 2 Min. hell anschwitzen. Milch nach und nach mit dem Schneebesen einrühren, klümpchenfrei. 5 Min. köcheln bis die Soße deutlich andickt.","Vom Herd nehmen, Knoblauch, zwei Drittel des geriebenen Käses, Muskat, Salz und Pfeffer einrühren. Kräftig abschmecken — die Soße darf für sich fast zu würzig sein.","Gemüse, Kartoffeln und Pute in eine große Auflaufform mischen. Soße drübergießen und durchziehen. Restlichen Käse und Parmesan drüber.","30–35 Min. backen bis goldbraun und an den Rändern blubbernd. 5 Min. ruhen lassen."]},
"TK-Dumplings aus dem Ofen":{b:3,zu:ZU.dump,kcal:520,prot:24,st:["Ofen auf 200°C vorheizen. Currypaste mit dem festen, dicken Anteil aus der Kokosmilchdose in einer Pfanne 2–3 Min. anrösten, bis es intensiv duftet. Ingwer und Knoblauch gerieben kurz mitrösten.","Restliche Kokosmilch, Sojasoße, Honig und Erdnussbutter einrühren, 3–4 Min. köcheln bis die Sauce leicht andickt. Sie soll sämig sein, nicht wässrig.","Brokkoli und Paprika in eine Auflaufform geben, Sauce drübergießen und durchmischen.","Dumplings mit der flachen Seite nach unten in die Sauce setzen, sodass sie zur Hälfte eintauchen. Oberseite mit etwas Sauce bestreichen.","20–25 Min. backen, bis die Dumplings oben goldbraun und knusprig sind und die Sauce eingedickt ist.","Limettensaft und Sesamöl darüber, Frühlingszwiebeln drüber streuen."]},
"One-Pot Lachs-Orzo":{b:3,zu:ZU.orzo,kcal:480,prot:40,st:["Knoblauch goldbraun rösten.","Tomaten und Brühe angießen, Orzo einrühren.","7–8 Min. unter gelegentlichem Rühren garen.","Lachs in Stücke brechen, einlegen, 5 Min. ziehen lassen.","Spinat unterheben, bis er zusammenfällt. Mit Zitronensaft abschmecken, Parmesan drüber."]},
"Baked Potato mit Thunfisch & Kräuterquark":{b:3,zu:ZU.bak,kcal:410,prot:36,st:["Ofen auf 200°C. Kartoffeln mit Olivenöl einreiben, mit grobem Salz bestreuen.","Mehrfach einstechen, 50–60 Min. auf dem Rost backen. Keine Alufolie — macht die Schale weich.","Thunfisch mit Kräuterquark, Senf, Zitronensaft und Paprika edelsüß verrühren.","Kartoffeln kreuzförmig einschneiden, aufdrücken, Füllung großzügig drauf."]},
"Hähnchen-Tikka mit Reis":{b:3,zu:ZU.tikka,kcal:500,prot:46,hinweise:["Joghurt wird geteilt: 200 g für die Marinade, der Rest für den Dip."],st:["Marinade: 200g Joghurt mit allen Gewürzen, Ingwer, Knoblauch, Zitronensaft und fein gehackter frischer Chili verrühren. Hähnchen mindestens 1 Stunde marinieren.","Restlichen Joghurt mit Zitronensaft, Salz und Pfeffer zu Dip rühren.","Reis waschen und kochen.","Hähnchen in sehr heißer Pfanne portionsweise anbraten — die Marinade soll karamellisieren und leicht anbrennen. Das sind die Tikka-Röstaromen.","Mit Reis und Joghurt-Dip servieren."]},
"Halloumi-Pfanne mit Bulgur":{b:3,zu:ZU.halloumi,kcal:490,prot:32,st:["Bulgur mit kochendem Salzwasser übergießen (1:1,5), 15 Min. quellen lassen.","Halloumi in 1 cm dicke Scheiben schneiden, in sehr heißer Pfanne ohne Fett von jeder Seite 2–3 Min. goldbraun anbraten. Herausnehmen.","In derselben Pfanne Olivenöl erhitzen, rote Zwiebel und Knoblauch anschwitzen. Zucchini und Paprika in Würfeln dazu, 5 Min. kräftig anbraten.","Kirschtomaten und passierte Tomaten dazu, Oregano einrühren, 5 Min. köcheln.","Bulgur unterheben, Halloumi drauflegen. Zitronensaft drüber, Basilikum zupfen."]},
"Zitronenbutter-Kabeljau aus dem Ofen":{b:3,zu:ZU.kab,kcal:420,prot:40,st:["Ofen auf 200°C. Kartoffeln in dünne Scheiben schneiden, mit Olivenöl, Salz und Pfeffer auf Blech.","20 Min. vorrösten bis die Kartoffeln goldbraun werden.","Kabeljau trocken tupfen, auf das Blech legen. Butter in Flöckchen drauf, Knoblauch in Scheiben und Zitronenscheiben dazwischen verteilen.","12–15 Min. backen bis der Fisch gar ist und die Butter schäumt.","Dill und frisch gepressten Zitronensaft drüber — direkt vom Blech servieren."]},
"Honig-Möhren mit Fetacreme und Fladenbrot":{b:3,zu:ZU.moehren,kcal:380,prot:16,st:["Möhren schälen, längs halbieren. In einer großen Pfanne Butter bei mittlerer Hitze schmelzen, Möhren einlegen, 5 Min. anbraten.","Honig und Kreuzkümmel dazu, Hitze erhöhen. Möhren 10–12 Min. karamellisieren lassen bis sie dunkelgolden und weich sind. Zwischendurch wenden.","Fetacreme: Feta grob zerbröseln, mit Joghurt, Olivenöl und Zitronensaft pürieren oder mit der Gabel sehr fein zerdrücken, bis eine cremige Masse entsteht. Mit Pfeffer abschmecken — Salz ist meist nicht nötig.","Fladenbrot kurz in der trockenen Pfanne oder im Ofen anwärmen.","Fetacreme auf Fladenbrot streichen, karamellisierte Möhren drauf, frischen Koriander zupfen. Restlichen Honig-Fond aus der Pfanne drüber träufeln."]},
"Asiatische Hackfleisch-Bowl":{b:3,zu:ZU.hack,kcal:480,prot:38,st:["Reisnudeln nach Packung einweichen oder kochen.","Paprika in Streifen, Möhren in feine Scheiben. In etwas Öl 3–4 Min. anbraten bis leicht gebräunt. Beiseite stellen.","Hack in sehr heißer Pfanne ohne Fett scharf anbraten — nicht rühren bis eine braune Kruste entsteht.","Knoblauch und Ingwer gerieben dazu, Sojasoße, Honig, Sesamöl angießen. Frische Chili (entkernt, fein gehackt) dazu — kurz karamellisieren lassen. Es entsteht bewusst reichlich Sauce.","Gemüse zurück, schwenken, sodass alles gut mit Sauce überzogen ist. Reisnudeln in Bowls, Hack samt Sauce drauf, Frühlingszwiebeln und Sesam drüber."]},
"No-Bake Energy Bites":{b:46,zu:ZU.energy,kcal:49,prot:2,st:["Kokosraspeln in einer trockenen Pfanne bei mittlerer Hitze 3–4 Min. goldbraun rösten. Sofort auf einen Teller geben und komplett abkühlen lassen.","Alle Zutaten in einer großen Schüssel gründlich verrühren — Kokos erst nach dem Abkühlen zugeben, sonst schmilzt die Schokolade.","Schüssel abdecken und 1–2 Stunden im Kühlschrank kühlen.","Zu 46 Kugeln formen (je ca. 1 EL Masse). Bis zu 1 Woche im Kühlschrank, 3 Monate eingefroren."]},
"Chocolate Coconut Haystacks":{b:24,zu:ZU.haystacks,kcal:92,prot:2,st:["Kokosflocken in einer trockenen Pfanne bei mittlerer Hitze 3–4 Min. goldbraun rösten, dabei ständig rühren. Sofort auf einen Teller — sie rösten schnell nach.","Schokolade mit Kokosöl in der Mikrowelle in 30-Sek.-Intervallen schmelzen, dazwischen rühren.","Erdnussbutter einrühren bis glatt. Kokosflocken, Chiasamen und gepufften Quinoa unterheben.","Mit einem Esslöffel 24 kleine Häufchen auf Backpapier setzen.","20–30 Min. ins Tiefkühlfach bis fest. In Gefrierbeutel umfüllen, direkt aus dem Tiefkühler essen."]},
"Käse-Spätzle mit Röstzwiebeln":{b:3,zu:ZU.spaetzle,kcal:560,prot:24,st:["Ofen auf 200°C. Möhren in Stifte schneiden, mit Olivenöl, Salz und Pfeffer auf ein Blech, 20 Min. rösten bis sie karamellisieren.","Käse grob reiben. Butter in einer großen Pfanne schmelzen, Spätzle darin kurz anschwenken.","Spätzle und Käse abwechselnd schichten (Pfanne oder Auflaufform), sodass der Käse zwischen den Spätzle schmilzt. Zugedeckt 3–4 Min. bei milder Hitze ziehen lassen.","Röstzwiebeln und Schnittlauch darüber. Mit den Ofen-Möhren servieren."]},
"Lachs-Frikadellen mit Kartoffelspalten":{b:3,zu:ZU.lachsfrik,kcal:490,prot:40,st:["Ofen auf 200°C. Kartoffeln in Spalten schneiden, mit 2 EL Öl, Salz und Pfeffer auf ein Blech, 25 Min. backen, nach der Hälfte wenden.","Lachs auftauen, trocken tupfen, fein hacken. Mit Ei, Semmelbröseln, Senf, gehacktem Dill, etwas Zitronenabrieb, Salz und Pfeffer verkneten. 6 Frikadellen formen.","In Öl bei mittlerer Hitze 3–4 Min. pro Seite goldbraun braten.","Joghurt mit Dill, Zitronensaft und Salz zu einem Dip rühren. Mit Kartoffelspalten servieren."]},
"Puten-Geschnetzeltes mit Reis":{b:3,zu:ZU.putgesch,kcal:510,prot:46,st:["Reis waschen und kochen.","Putenschnitzel in Streifen schneiden, salzen, pfeffern. In heißem Öl scharf anbraten, herausnehmen.","Zwiebel würfeln, Champignons in Scheiben. Beides in derselben Pfanne 4–5 Min. braten.","Brühe und Sahne angießen, Senf einrühren, 3–4 Min. einköcheln. Pute zurück, kurz erhitzen. Mit Petersilie und Reis servieren."]},
"Hähnchen-Reispfanne mit Mais und Paprika":{b:3,zu:ZU.hreis,kcal:500,prot:42,st:["Hähnchen würfeln, mit Paprika edelsüß, Salz und Pfeffer würzen. In Öl scharf anbraten, herausnehmen.","Zwiebel und Paprika würfeln, 4 Min. anbraten. Reis dazugeben, kurz mitrösten.","Brühe angießen, Mais (abgetropft) einrühren, Hähnchen zurück. Aufkochen, Deckel drauf, 18 Min. bei niedriger Hitze garen.","5 Min. ruhen lassen, Frühlingszwiebeln drüber."]},
"Ofen-Feta-Pasta":{b:3,zu:ZU.fetapasta,kcal:520,prot:22,st:["Ofen auf 200°C. Feta-Block in die Mitte einer Auflaufform, Kirschtomaten und angedrückte Knoblauchzehen drumherum. Alles mit Olivenöl beträufeln, salzen, pfeffern.","30–35 Min. backen bis die Tomaten platzen und der Feta weich ist.","Pasta al dente kochen, etwas Kochwasser aufheben.","Feta und Tomaten mit der Gabel zu einer cremigen Sauce zerdrücken. Pasta und etwas Kochwasser unterheben, Basilikum zupfen."]},
"Hähnchen-Nuggets mit Süßkartoffel-Pommes":{b:3,zu:ZU.nuggets,kcal:560,prot:44,st:["Ofen auf 220°C. Süßkartoffeln in Pommes schneiden, mit 2 EL Öl, Salz auf ein Blech, 25 Min. backen, nach der Hälfte wenden.","Hähnchen in mundgerechte Stücke schneiden. Drei Teller: Mehl mit Paprika edelsüß und Salz, verquirltes Ei, Semmelbrösel.","Hähnchenstücke nacheinander in Mehl, Ei und Bröseln wenden.","In Öl bei mittlerer Hitze rundum goldbraun braten (oder die letzten 12 Min. mit auf dem Blech backen). Mit Joghurt-Dip servieren."]},
"Spaghetti Bolognese":{b:3,zu:ZU.bolo,kcal:540,prot:38,st:["Zwiebel und Knoblauch fein würfeln, Möhren fein raspeln.","Hack in Öl scharf anbraten bis es Farbe bekommt. Zwiebel, Knoblauch und Möhren dazu, 3–4 Min. mitbraten.","Tomatenmark einrühren, kurz anrösten. Mit passierten Tomaten ablöschen, Oregano, Salz, Pfeffer. 15 Min. köcheln.","Spaghetti al dente kochen. Mit der Sauce und Parmesan servieren."]},
"Bauernfrühstück mit Tomatensalat":{b:3,zu:ZU.bauern,kcal:480,prot:28,st:["Kartoffeln in Scheiben schneiden, in Salzwasser 8 Min. vorkochen, abgießen.","Speck und gewürfelte Zwiebel in Öl anbraten. Kartoffeln dazu, in Ruhe goldbraun braten.","Eier verquirlen, salzen, über die Kartoffeln gießen. Bei milder Hitze stocken lassen.","Tomaten in Scheiben, mit Olivenöl, Salz und Pfeffer anmachen. Schnittlauch über die Pfanne, mit dem Tomatensalat servieren."]},
"Gnocchi-Pfanne mit Brokkoli und Hähnchen":{b:3,zu:ZU.gnocchi,kcal:530,prot:42,st:["Brokkoli in Röschen, 4 Min. in Salzwasser blanchieren, abgießen.","Hähnchen würfeln, salzen, pfeffern. In Öl scharf anbraten, herausnehmen.","Gnocchi in derselben Pfanne 5–6 Min. goldbraun anbraten. Knoblauch kurz mit.","Sahne angießen, Brokkoli und Hähnchen zurück, Parmesan einrühren, 2 Min. erwärmen. Abschmecken."]},
"Selbstgemachte Fischstäbchen mit Kartoffelspalten":{b:3,zu:ZU.fisch,kcal:520,prot:40,st:["Ofen auf 200°C. Kartoffeln in Spalten, mit Öl und Salz auf ein Blech, 25 Min. backen.","Kabeljau auftauen, trocken tupfen, in Stäbchen schneiden. Drei Teller: Mehl mit Salz, verquirltes Ei, Semmelbrösel.","Fischstäbchen in Mehl, Ei und Bröseln wenden.","In Öl bei mittlerer Hitze 2–3 Min. pro Seite goldbraun braten. Joghurt mit Dill und Zitronensaft zum Dip rühren. Mit Kartoffelspalten servieren."]},
"Milde Kokos-Hähnchen-Curry mit Reis":{b:3,zu:ZU.curry,kcal:520,prot:40,st:["Reis waschen und kochen.","Hähnchen würfeln, in Öl scharf anbraten, herausnehmen.","Zwiebel, Paprika und Knoblauch 4 Min. anbraten. Currypaste kurz mitrösten.","Kokosmilch angießen, Honig einrühren, Hähnchen zurück. 8 Min. köcheln. Mit Koriander und Reis servieren."]},
"Flammkuchen mit Crème fraîche und Schinken":{b:3,zu:ZU.flamm,kcal:560,prot:22,st:["Ofen auf 220°C. Brokkoli in Röschen, mit Öl und Salz auf ein Blech, kommt die letzten 15 Min. mit in den Ofen.","Flammkuchenteig ausrollen. Crème fraîche mit Salz, Pfeffer und etwas Muskat verrühren, dünn aufstreichen.","Zwiebeln in feine Ringe, Speck in Streifen, beides verteilen.","12–15 Min. backen bis der Rand knusprig ist. Mit dem Ofen-Brokkoli servieren."]},
"Couscous-Pfanne mit Hackfleisch":{b:3,zu:ZU.couscous,kcal:520,prot:36,st:["Zwiebel würfeln, Paprika und Zucchini in Würfel schneiden.","Hack in Öl scharf anbraten. Zwiebel, Paprika und Zucchini dazu, 4–5 Min. mitbraten.","Paprika edelsüß und Kreuzkümmel einrühren, passierte Tomaten dazu, kurz köcheln.","Couscous einrühren, heiße Brühe angießen, Deckel drauf, Hitze aus. 5 Min. quellen lassen, auflockern."]},
"Ofen-Gnocchi mit Tomaten und Mozzarella":{b:3,zu:ZU.ofengno,kcal:510,prot:24,st:["Ofen auf 220°C. Gnocchi (ungekocht), halbierte Kirschtomaten und angedrückten Knoblauch in eine Auflaufform. Mit Olivenöl, Oregano, Salz und Pfeffer mischen.","20 Min. backen, bis die Gnocchi weich sind und die Tomaten platzen.","Mozzarella in Stücke zupfen, darüber verteilen. Weitere 8 Min. backen bis der Käse geschmolzen ist.","Basilikum und Parmesan darüber."]}
};

let syncFailed=false;
function syncState(s){
  const d=document.getElementById("sync-dot");
  d.classList.remove("busy","ok","err");
  if(s==="busy")d.classList.add("busy");
  if(s==="err"){d.classList.add("err");syncFailed=true;}
  if(s==="ok"){d.classList.add("ok");syncFailed=false;setTimeout(()=>d.classList.remove("ok"),2500);}
}

let errShown=false;
function syncErr(status,aktion){
  syncState("err");
  if(errShown)return;errShown=true;
  let hint="Unbekannter Fehler ("+status+").";
  if(status===401)hint="Der Token ist ungültig oder abgelaufen. Bitte in den Einstellungen neu eingeben.";
  if(status===403)hint="Dem Token fehlt die Berechtigung. Auf airtable.com/create/tokens hat der Token zwei Abschnitte — 'Scopes' UND 'Access'. Unter 'Access' muss deine Base explizit hinzugefügt sein.";
  if(status===404)hint="Base oder Tabelle nicht gefunden. Prüfe die Base-ID (beginnt mit 'app…') und dass die Tabelle 'Sync' heißt und beim Token unter 'Access' freigegeben ist.";
  if(status===422)hint="Datenformat abgelehnt (422). Bitte melden.";
  alert("Synchronisierung fehlgeschlagen beim "+aktion+".\n\n"+hint);
}

async function atLoad(){
  const t=atToken();if(!t||!atBase())return;
  syncState("busy");
  try{
    const r=await fetch(atUrl()+"?pageSize=100",{headers:{Authorization:"Bearer "+t}});
    if(!r.ok){syncErr(r.status,"Laden");return;}
    if(dirty){flushSave(false);return;}
    const d=await r.json();
    recMap={};const byKey={};
    (d.records||[]).forEach(rc=>{const k=rc.fields&&rc.fields.Key;if(k){recMap[k]=rc.id;byKey[k]=rc.fields;}});
    SYNC_FIELDS.forEach(fd=>{
      const fields=byKey[fd.k];if(!fields)return;
      if(fd.t==="num"){if(fields.Num!==undefined&&fields.Num!==null)fd.set(fields.Num);}
      else{try{if(fields.Data)fd.set(JSON.parse(fields.Data));}catch{}}
    });
    syncState("ok");
  }catch(e){syncState("err");}
}

let saveTimer=null,dirty=false;
function chunk10(arr){const o=[];for(let i=0;i<arr.length;i+=10)o.push(arr.slice(i,i+10));return o;}
async function flushSave(keepalive){
  const t=atToken();if(!t||!atBase()||!dirty)return;
  dirty=false;clearTimeout(saveTimer);
  syncState("busy");
  try{
    const patch=[],create=[];
    SYNC_FIELDS.forEach(fd=>{
      const fields={};
      if(fd.t==="num")fields.Num=fd.get(); else fields.Data=JSON.stringify(fd.get());
      if(recMap[fd.k])patch.push({id:recMap[fd.k],fields});
      else create.push({fields:Object.assign({Key:fd.k},fields)});
    });
    for(const grp of chunk10(patch)){
      const r=await fetch(atUrl(),{method:"PATCH",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({records:grp}),keepalive:!!keepalive});
      if(!r.ok){syncErr(r.status,"Speichern");dirty=true;return;}
    }
    for(const grp of chunk10(create)){
      const r=await fetch(atUrl(),{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({records:grp}),keepalive:!!keepalive});
      if(!r.ok){syncErr(r.status,"Speichern");dirty=true;return;}
      const dd=await r.json();(dd.records||[]).forEach(rc=>{const k=rc.fields&&rc.fields.Key;if(k)recMap[k]=rc.id;});
    }
    syncState("ok");
  }catch(e){syncState("err");dirty=true;}
}
function atSave(){
  if(!atToken())return;
  dirty=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>flushSave(false),700);
}

function attachRzDrag(){
  const cont=document.getElementById("rz-sortable");if(!cont)return;
  const rows=[...cont.querySelectorAll(".rz-drag")];
  let drag=null;
  rows.forEach(row=>{
    const handle=row.querySelector(".rz-handle");
    handle.addEventListener("touchstart",e=>{
      e.preventDefault();
      const t=e.touches[0];
      const rects=rows.map(r=>r.getBoundingClientRect());
      drag={row,fromPos:+row.dataset.pos,startY:t.clientY,curPos:+row.dataset.pos,rects,h:rects[0].height+8};
      row.classList.add("rz-lift");
    },{passive:false});
    handle.addEventListener("touchmove",e=>{
      if(!drag)return;e.preventDefault();
      const t=e.touches[0];
      const dy=t.clientY-drag.startY;
      drag.row.style.transform=`translateY(${dy}px)`;
      // Zielposition anhand der Fingerhöhe bestimmen
      const centerY=drag.rects[drag.fromPos].top+drag.rects[drag.fromPos].height/2+dy;
      let np=0;
      for(let i=0;i<drag.rects.length;i++){if(centerY>drag.rects[i].top+drag.rects[i].height/2)np=i+1;}
      np=Math.max(0,Math.min(rows.length-1,np>drag.fromPos?np-1:np));
      if(np!==drag.curPos){
        drag.curPos=np;
        // Andere Zeilen verschieben, um Lücke zu zeigen
        rows.forEach(r=>{
          const p=+r.dataset.pos;if(r===drag.row)return;
          let shift=0;
          if(drag.fromPos<np&&p>drag.fromPos&&p<=np)shift=-drag.h;
          else if(drag.fromPos>np&&p>=np&&p<drag.fromPos)shift=drag.h;
          r.style.transform=shift?`translateY(${shift}px)`:"";
        });
      }
    },{passive:false});
    const end=()=>{
      if(!drag)return;
      const{fromPos,curPos}=drag;
      rows.forEach(r=>{r.style.transform="";r.classList.remove("rz-lift");});
      if(fromPos!==curPos){
        const order=weekOrder().slice();
        const[moved]=order.splice(fromPos,1);
        order.splice(curPos,0,moved);
        rezeptReihenfolge[aktWoche]=order;
        saveShared();
      }
      drag=null;
      renderRezepte();
    };
    handle.addEventListener("touchend",end);
    handle.addEventListener("touchcancel",end);
  });
}

function getHerkunft(name){
  const tage=getTage();const out=[];
  const scan=(zs,f,quelle,port)=>{const hit=zs.find(it=>it.n===name);if(hit){const v=hit.c!==null?Math.min(hit.v*f,hit.c):hit.v*f;out.push({quelle,port,menge:fm(v,hit.e)});}};
  tage.forEach(({plan,idx,wochentag})=>{
    const sel=auswahl[idx];
    if(sel.f)scan(ZU.oats,getPort("Overnight Oats")/RZ["Overnight Oats"].b,wochentag+": Overnight Oats",getPort("Overnight Oats"));
    if(sel.a)scan(AUFL[plan.a]||[],1,wochentag+": "+plan.a,null);
    if(sel.k){const r=RZ[plan.k];if(r)scan(r.beilage?[...r.zuK,...(getBei(plan.k)==="B"?r.zuB:r.zuA)]:r.zu,getPort(plan.k)/r.b,wochentag+": "+plan.k,getPort(plan.k));}
  });
  if(energyAktiv)scan(ZU.energy,1,"Snack: Energy Bites",null);
  if(haystacksAktiv)scan(ZU.haystacks,1,"Snack: Haystacks",null);
  return out;
}

}

function getEinkauf(){
  const tage=getTage();const map={};
  const add=(zs,f)=>zs.forEach(it=>{
    const v=it.c!==null?Math.min(it.v*f,it.c):it.v*f;
    if(!map[it.n])map[it.n]={n:it.n,e:it.e,v:0,c:it.c};
    map[it.n].v+=v;
  });
  tage.forEach(({plan,idx})=>{
    if(!ekTage[idx])return;
    const sel=auswahl[idx];
    if(sel.f)add(ZU.oats,getPort("Overnight Oats")/RZ["Overnight Oats"].b);
    if(sel.a)add(AUFL[plan.a]||[],1);
    if(sel.k){const r=RZ[plan.k];if(r)add(r.beilage?[...r.zuK,...(getBei(plan.k)==="B"?r.zuB:r.zuA)]:r.zu,getPort(plan.k)/r.b);}
  });
  const addFixed=zs=>zs.forEach(it=>{if(!map[it.n])map[it.n]={n:it.n,e:it.e,v:it.v,c:it.c};else map[it.n].v=Math.max(map[it.n].v,it.v);});
  if(energyAktiv)addFixed(ZU.energy);
  if(haystacksAktiv)addFixed(ZU.haystacks);
  const items=Object.values(map).map(it=>({n:it.n,m:fm(it.c!==null?Math.min(it.v,it.c):it.v,it.e)}));
  const g={};KATS.forEach(k=>g[k]=[]);
  items.forEach(it=>(g[gk(it.n)]||g["Sonstiges"]).push(it));
  return KATS.map(k=>({kat:k,items:g[k].sort((a,b)=>a.n.localeCompare(b.n))})).filter(k=>k.items.length>0);
}

function renderEinkauf(){
  const kats=getEinkauf();
  const alle=kats.flatMap(k=>k.items);
  const offen=alle.filter(it=>!vorhanden[it.n]).length;
  const uebersicht=getMahlzeitUebersicht();
  let html="";
  if(uebersicht.length===0){
    html=`<div class="empty-hint">Noch nichts geplant.<br>Wähle im Plan aus, welche Mahlzeiten ihr kochen wollt — die Einkaufsliste entsteht daraus.</div>`;
    document.getElementById("pane-einkauf").innerHTML=html;
    return;
  }
  // Kopfzeile Zähler (nur wenn Liste nicht leer)
  html=`<div class="ek-count"><span class="ek-count-n" id="ek-count-n">${alle.length?offen+" noch benötigt":"Nichts ausgewählt"}</span><span class="ek-count-s" id="ek-count-s">${alle.length?(alle.length-offen)+" von "+alle.length+" vorhanden":""}</span></div>
  <div class="pad">
    <div class="kat-sec">
      <div class="ek-dayhd"><span class="ek-dayhd-day">Tag</span><span class="ek-dayhd-ic"><svg viewBox="0 0 24 24" fill="none"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="currentColor" stroke-width="1.6"/><path d="M3 6h18M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="1.6"/></svg></span></div>
      <div class="ek-list">${uebersicht.map(t=>`<div class="ek-dayrow"><div class="ek-dayinfo"><span class="ek-name" style="font-weight:700">${t.wochentag}</span><span style="font-size:13px;color:var(--ink-2)">${t.teile.join(" · ")}</span></div><button class="ek-daybtn cart${ekTage[t.idx]?" on":""}" onclick="toggleEkTag(${t.idx})"><svg viewBox="0 0 24 24" fill="none"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke-width="1.7"/><path d="M3 6h18M16 10a4 4 0 01-8 0" stroke-width="1.7"/></svg></button></div>`).join("")}</div>
    </div>`;
  if(alle.length===0){

async function doCopy(){
  const kats=getEinkauf();const uebersicht=getMahlzeitUebersicht();const lines=[];
  if(uebersicht.length>0){

    uebersicht.filter(t=>ekTage[t.idx]).forEach(t=>lines.push(t.wochentag+": "+t.teile.join(" · ")));

  kats.forEach(({kat,items})=>{

    if(!rest.length)return;
    lines.push(kat);rest.forEach(it=>lines.push("☐ "+it.n+" ("+it.m+")"));lines.push("");

    const btn=document.getElementById("btn-copy");if(btn){btn.textContent="Kopiert ✓";setTimeout(()=>btn.textContent="Einkaufsliste kopieren",2000);}

// ── Wochenplanung ──
function isoWeekKey(offset){
  const d=new Date();d.setDate(d.getDate()+offset*7);
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const kw=Math.ceil(((t-ys)/86400000+1)/7);
  return t.getUTCFullYear()+"-W"+kw;
}
function wochenLabel(offset){
  if(offset===0)return "Diese Woche";
  if(offset===1)return "Nächste Woche";
  if(offset===-1)return "Letzte Woche";
  return "KW "+isoWeekKey(offset).split("-W")[1];
}
function mondayOf(offset){
  const d=new Date();const day=(d.getDay()||7)-1;
  d.setDate(d.getDate()-day+offset*7);return d;
}
function ymd(d){const m=String(d.getMonth()+1).padStart(2,"0");const t=String(d.getDate()).padStart(2,"0");return d.getFullYear()+"-"+m+"-"+t;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function wpEintraegeFuerWoche(offset){
  const wk=isoWeekKey(offset);
  const mo=mondayOf(offset);
  const tage=[];for(let i=0;i<7;i++){const d=new Date(mo);d.setDate(mo.getDate()+i);tage.push(ymd(d));}
  const list=[];
  wpSerien.forEach(s=>(s.tage||[]).forEach(tag=>{
    if(wpAusnahmen[s.id+"__"+wk+"__"+tag])return;
    list.push({id:s.id,serie:true,titel:s.titel,person:s.person,tag,zeit:s.zeit||"",wk});
  }));
  wpEintraege.forEach(e=>{
    if(e.vonDate){
      const mehr=e.bisDate>e.vonDate;
      for(let i=0;i<7;i++){
        if(tage[i]>=e.vonDate&&tage[i]<=e.bisDate)
          list.push({id:e.id,serie:false,titel:e.titel,person:e.person,tag:i,zeit:e.zeit||"",mehrtag:mehr,wk});
      }
    }else if(e.wk===wk){
      const von=e.tag,bis=e.tagEnde!=null?e.tagEnde:e.tag;
      for(let t=von;t<=bis;t++)list.push({id:e.id,serie:false,titel:e.titel,person:e.person,tag:t,zeit:e.zeit||"",mehrtag:bis>von,wk});
    }
  });
  return list;
}

function renderWoche(){
  const eintr=wpEintraegeFuerWoche(wpWoche);
  const mo=mondayOf(wpWoche);
  const proTag={};for(let i=0;i<7;i++)proTag[i]=[];
  eintr.forEach(e=>proTag[e.tag]&&proTag[e.tag].push(e));
  Object.values(proTag).forEach(a=>a.sort((x,y)=>(x.zeit||"~").localeCompare(y.zeit||"~")));
  let html=`<div class="wp-weeknav">
    <button class="wp-arrow" onclick="wpWoche--;renderWoche()">‹</button>
    <div class="wp-weeklbl">${wochenLabel(wpWoche)}</div>
    <button class="wp-arrow" onclick="wpWoche++;renderWoche()">›</button>
  </div>
  <div class="pad">`;
  for(let i=0;i<7;i++){
    const d=new Date(mo);d.setDate(mo.getDate()+i);
    const heute=(wpWoche===0&&((new Date().getDay()||7)-1)===i);

    if(proTag[i].length===0){html+=`<div class="wp-empty">—</div>`;}
    else proTag[i].forEach(e=>{

      </div>`;

    html+=`</div>`;

  html+=`</div>`;
  document.getElementById("pane-woche").innerHTML=html;
}

function allBeikost(){return BEIKOST_DB.concat(beikostExtra.map(e=>[e.n,e.kat,e.a?1:0]));}
function beikostSuche(q){
  q=q.trim().toLowerCase();if(!q)return [];
  const treffer=new Map();
  const add=(name,score)=>{if(!treffer.has(name)||treffer.get(name)>score)treffer.set(name,score);};
  const db=allBeikost();
  // 1. Synonyme
  Object.keys(BEIKOST_SYN).forEach(syn=>{if(syn.includes(q)||q.includes(syn))BEIKOST_SYN[syn].forEach(n=>add(n,0));});
  // 2. Direkter Namensmatch
  db.forEach(([n])=>{const nl=n.toLowerCase();if(nl.includes(q))add(n,1);else if(q.length>=3&&nl.split(/[\s/,]+/).some(w=>w.startsWith(q.slice(0,4))))add(n,2);});
  // 3. Kategorie-Match
  db.forEach(([n,k])=>{if(k.toLowerCase().includes(q))add(n,3);});
  const namen=new Set(db.map(d=>d[0]));
  return [...treffer.keys()].filter(n=>namen.has(n)).sort((a,b)=>treffer.get(a)-treffer.get(b)).slice(0,12);
}
let beikostQuery="";

function beikostInfo(name){const row=allBeikost().find(r=>r[0]===name);return row?{kat:row[1],allergen:row[2]}:null;}
function beikostSetCount(name,c){

}
function beikostAdd(name){
  const clean=name.trim();if(!clean)return;
  if(!allBeikost().some(r=>r[0].toLowerCase()===clean.toLowerCase())){
    beikostExtra.push({n:clean,kat:"Eigene",a:0});
  }
  beikost[clean]=1;
  beikostQuery="";
  saveShared();renderBeikost();
}
function renderBeikostResults(){
  const box=document.getElementById("bk-results");if(!box)return;

  box.style.display="block";

  let html="";
  res.forEach(n=>{
    const info=beikostInfo(n);const c=beikost[n]||0;
    html+=`<div class="bk-res" onclick="beikostSetCount('${n.replace(/'/g,"\\'")}',${Math.min(c+1,5)})"><span class="bk-res-n">${n}${info&&info.allergen?' <span class="bk-alg">⚠</span>':""}</span><span class="bk-res-c">${c>0?c+"/5":"+ hinzufügen"}</span></div>`;
  });
  const exact=allBeikost().some(r=>r[0].toLowerCase()===q.toLowerCase());
  if(!exact)html+=`<div class="bk-res bk-res-add" onclick="beikostAdd('${q.replace(/'/g,"\\'")}')"><span class="bk-res-n">„${q}" neu anlegen</span><span class="bk-res-c">1/5</span></div>`;
  box.innerHTML=html;
}
function renderBeikost(){
  const q=beikostQuery;
  let html=`<div class="bk-searchwrap">
    <input class="bk-search" id="bk-search" placeholder="Lebensmittel suchen…" value="${q.replace(/"/g,"&quot;")}" oninput="beikostSearchInput(this.value)" autocapitalize="sentences" autocorrect="on" spellcheck="true" enterkeyhint="search">
    <div class="bk-results" id="bk-results" style="display:none"></div>
  </div>
  <div class="pad">`;
  // Fortschritt
  const db=allBeikost();

  html+=`<div class="bk-progress"><div class="bk-progress-n">${probiert} von ${db.length} probiert</div><div class="bk-bar"><div class="bk-bar-fill" style="width:${Math.round(probiert/db.length*100)}%"></div></div></div>`;
  // Gruppiert nach Kategorie, nur mit Einträgen die probiert wurden ODER alle? Zeige alle probierten gruppiert, plus Rest ausgegraut je Kategorie
  const kats=BEIKOST_KATS.concat(beikostExtra.length?["Eigene"]:[]);
  kats.forEach(kat=>{
    const items=db.filter(([,k])=>k===kat);
    const probierteItems=items.filter(([n])=>(beikost[n]||0)>0);
    if(items.length===0)return;
    html+=`<div class="bk-kat"><div class="bk-kat-hd">${kat}<span class="bk-kat-n">${probierteItems.length}/${items.length}</span></div>`;
    items.forEach(([n,k,alg])=>{
      const c=beikost[n]||0;
      html+=`<div class="bk-item${c>0?" done":""}">
        <span class="bk-item-n">${n}${alg?' <span class="bk-alg">⚠</span>':""}</span>
        <div class="bk-dots">${[1,2,3,4,5].map(i=>`<button class="bk-dot${i<=c?" on":""}" onclick="beikostSetCount('${n.replace(/'/g,"\\'")}',${i===c?i-1:i})"></button>`).join("")}</div>
      </div>`;
    });

function attachKindSwipe(){
  document.querySelectorAll("#pane-uebersicht .kl-item").forEach(card=>{
    let x0=null,y0=null,dx=0,lock=null;
    const inner=card.querySelector(".kl-item-inner");
    card.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;lock=null;inner.style.transition="none";},{passive:true});
    card.addEventListener("touchmove",e=>{
      if(x0==null)return;const cx=e.touches[0].clientX,cy=e.touches[0].clientY;
      if(lock==null)lock=Math.abs(cx-x0)>Math.abs(cy-y0)+4?"x":"y";
      if(lock!=="x")return;
      dx=cx-x0;if(dx>0)return;
      inner.style.transform="translateX("+dx+"px)";
      card.classList.toggle("sw-del",dx<-40);
    },{passive:true});
    card.addEventListener("touchend",()=>{
      if(lock!=="x"){x0=null;return;}
      inner.style.transition="transform .2s";
      if(dx<-90){inner.style.transform="translateX(-110%)";setTimeout(()=>kindListDel(card.dataset.kind,card.dataset.liste,card.dataset.id),140);}
      else inner.style.transform="";
      card.classList.remove("sw-del");x0=null;
    });
  });
}

        </div>

function moveTodo(id,ziel){

  const war=t.spalte;
  t.spalte=ziel;
  if(ziel==="erledigt"){t.erledigtAm=Date.now();if(war!=="erledigt")konfetti();}
  else t.erledigtAm=null;
  saveShared();renderTodos();
}
function nextStage(col){return col==="backlog"?"woche":col==="woche"?"erledigt":null;}
function prevStage(col){return col==="erledigt"?"woche":col==="woche"?"backlog":null;}

let tdUndo=null;
function deleteTodo(id){
  const idx=todos.findIndex(x=>x.id===id);if(idx<0)return;
  const gel=todos[idx];todos.splice(idx,1);
  saveShared();renderTodos();
  tdUndo={item:gel,idx};
  showUndo();
}
function showUndo(){
  let bar=document.getElementById("td-undo");
  if(!bar){bar=document.createElement("div");bar.id="td-undo";bar.className="td-undo";document.body.appendChild(bar);}
  bar.innerHTML=`<span>Gelöscht</span><button onclick="undoDelete()">Rückgängig</button>`;
  bar.classList.add("on");
  clearTimeout(showUndo._t);
  showUndo._t=setTimeout(hideUndo,4000);
}
function hideUndo(){clearTimeout(showUndo._t);const bar=document.getElementById("td-undo");if(bar)bar.classList.remove("on");tdUndo=null;}
function undoDelete(){
  if(!tdUndo)return;
  todos.splice(Math.min(tdUndo.idx,todos.length),0,tdUndo.item);
  hideUndo();saveShared();renderTodos();
}

// Wischen: rechts = eine Stufe vor, links = eine Stufe zurück
function attachTdSwipe(){
  document.querySelectorAll("#pane-todos .td-card").forEach(card=>{
    let x0=null,y0=null,dx=0,lock=null;
    const inner=card.querySelector(".td-card-inner");
    card.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;lock=null;inner.style.transition="none";},{passive:true});
    card.addEventListener("touchmove",e=>{
      if(x0==null)return;
      const cx=e.touches[0].clientX,cy=e.touches[0].clientY;
      if(lock==null){lock=Math.abs(cx-x0)>Math.abs(cy-y0)+4?"x":"y";}
      if(lock!=="x")return;
      dx=cx-x0;
      const col=card.dataset.col;
      if(dx>0&&!nextStage(col))return; // am Ende kein Weiter
      if(dx<0&&!prevStage(col))return; // am Anfang kein Zurück
      inner.style.transform="translateX("+dx+"px)";
      card.classList.toggle("sw-back",dx<-40);
      card.classList.toggle("sw-adv",dx>40);
    },{passive:true});
    card.addEventListener("touchend",()=>{
      if(lock!=="x"){x0=null;return;}
      inner.style.transition="transform .2s";
      const col=card.dataset.col,id=card.dataset.id;
      if(dx>90&&nextStage(col)){inner.style.transform="translateX(110%)";setTimeout(()=>moveTodo(id,nextStage(col)),140);}
      else if(dx<-90&&prevStage(col)){inner.style.transform="translateX(-110%)";setTimeout(()=>moveTodo(id,prevStage(col)),140);}
      else inner.style.transform="";
      card.classList.remove("sw-back","sw-adv");
      x0=null;
    });
  });
}

function konfetti(){
  const box=document.createElement("div");box.className="konfetti-box";
  document.body.appendChild(box);
  const cols=["#2E5A78","#6BA3C9","#3F7A5C","#9A7B2E","#9A6A8E","#C98A3E","#5FA98A"];
  const W=window.innerWidth,H=window.innerHeight;
  const ox=W/2, oy=H*0.42; // Ursprung des Bursts
  const N=90;
  const parts=[];
  for(let i=0;i<N;i++){
    const el=document.createElement("span");
    const shape=Math.random();
    const size=6+Math.random()*7;
    let w=size,h=size,rad="1px";
    if(shape<0.45){h=size*0.5;rad="1px";}            // Rechteck-Schnipsel
    else if(shape<0.75){rad="50%";}                   // Kreis
    else{w=3;h=13+Math.random()*10;rad="2px";}        // Streamer
    el.style.width=w+"px";el.style.height=h+"px";el.style.borderRadius=rad;
    el.style.background=cols[i%cols.length];
    el.style.opacity="1";
    box.appendChild(el);
    // Explosionsvektor: bevorzugt nach oben/seitwärts
    const ang=(-Math.PI/2)+(Math.random()-0.5)*Math.PI*1.15;
    const speed=7+Math.random()*11;
    parts.push({
      el,x:ox,y:oy,
      vx:Math.cos(ang)*speed+(Math.random()-0.5)*3,
      vy:Math.sin(ang)*speed-Math.random()*4,
      rot:Math.random()*360,vr:(Math.random()-0.5)*22,
      w,h
    });
  }
  const raf=window.requestAnimationFrame||function(cb){return setTimeout(()=>cb(),16);};
  const g=0.32, drag=0.99, fade=0.012;
  let op=1, t=0;
  function frame(){
    t++;
    op=t>44?Math.max(0,op-fade*1.8):op;
    for(const p of parts){
      p.vy+=g;p.vx*=drag;p.vy*=drag;
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      p.el.style.transform=`translate(${p.x-p.w/2}px,${p.y-p.h/2}px) rotate(${p.rot}deg)`;
      p.el.style.opacity=op;
    }
    if(t<130&&op>0)raf(frame);
    else box.remove();
  }
  raf(frame);
}

// ── Config anwenden ──
function applyConfig(){
  if(!cfg)return;
  Object.keys(PERSONEN).forEach(k=>delete PERSONEN[k]);
  [...(cfg.erwachsene||[]),...(cfg.kinder||[])].forEach((name,i)=>{PERSONEN[name]=MEMBER_COLORS[i%MEMBER_COLORS.length];});
  PERSONEN.Alle="#686763";
  KINDER.length=0;(cfg.kinder||[]).forEach(k=>KINDER.push(k));
  uebKind=KINDER[0]||"";
  if(KINDER.length)BEREICHE.kinder=_KINDER_AREA; else delete BEREICHE.kinder;
}

.ob-h .opt{color:var(--ink-2);font-weight:400}

.ob-li b{font-weight:600}
.ob-dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;background:#A66A12;margin-top:6px}

.ob-field::placeholder{color:var(--ink-2);opacity:.7}

.ob-step-b{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ob-step-n{font-size:20px;font-weight:600;min-width:28px;text-align:center;color:var(--ink)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ob-dot{background:#E0B470}:root:not([data-theme="light"]) .ob-add{color:#E0B470}:root:not([data-theme="light"]) .ob-btn{background:#E0B470;color:#1D1D1B}}
`;
let obState={screen:1,erw:["",""],kin:[""],port:3};
function startOnboarding(prefill){
  if(prefill&&cfg){obState={screen:2,erw:[...(cfg.erwachsene||[""])],kin:[...(cfg.kinder||[]),""].slice(0, (cfg.kinder||[]).length?(cfg.kinder||[]).length:1),port:cfg.portionen||3};
    if(!obState.erw.length)obState.erw=[""];if(!obState.kin.length)obState.kin=[""];}
  else obState={screen:1,erw:["",""],kin:[""],port:3};
  document.documentElement.setAttribute("data-bereich","start");
  if(!document.getElementById("ob-style")){const st=document.createElement("style");st.id="ob-style";st.textContent=OB_CSS;document.head.appendChild(st);}
  if(!document.getElementById("onboarding")){const ov=document.createElement("div");ov.id="onboarding";document.body.appendChild(ov);}
  renderOb();
}
function obSetScreen(n){obState.screen=n;renderOb();window.scrollTo(0,0);}
function obAddErw(){if(obState.erw.length<6)obState.erw.push("");renderOb();}
function obAddKin(){if(obState.kin.length<6)obState.kin.push("");renderOb();}
function obPort(d){obState.port=Math.max(1,Math.min(12,obState.port+d));renderOb();}
function esc(v){return (v||"").replace(/"/g,"&quot;");}
function renderOb(){
  const ov=document.getElementById("onboarding");if(!ov)return;
  if(obState.screen===1){
    ov.innerHTML=`<div class="ob-wrap">
      <div class="ob-logo">RathOS</div>
      <div class="ob-sub">Der Familienplaner von Svea und Jan</div>
      <p class="ob-p">Das ist das System, mit dem Svea und Jan ihren Familienalltag organisieren – Essen, Einkauf, To-dos, Wochenplan und die Kinder. Jetzt bekommst du eure eigene Kopie davon.</p>
      <p class="ob-p">Wie die App gedacht ist, hat dir Jan schon gezeigt – die kurze Einführung dazu liegt bei. Hier richtest du sie nur noch für euch ein.</p>
      <div class="ob-spacer"></div>
      <button class="ob-btn" onclick="obSetScreen(2)">Einrichten</button>
    </div>`;
  }else{
    ov.innerHTML=`<div class="ob-wrap">
      <div class="ob-logo">Einrichten</div>
      <div class="ob-sub">Diese Angaben kannst du später in den Einstellungen ändern.</div>
      <div class="ob-h">Erwachsene</div>
      ${obState.erw.map((v,i)=>`<input class="ob-field ob-erw" placeholder="Name" value="${esc(v)}" oninput="obState.erw[${i}]=this.value" autocapitalize="words" autocorrect="off">`).join("")}
      <button class="ob-add" onclick="obAddErw()">+ Person hinzufügen</button>
      <div class="ob-h">Kinder</div>
      ${obState.kin.map((v,i)=>`<input class="ob-field ob-kin" placeholder="Name" value="${esc(v)}" oninput="obState.kin[${i}]=this.value" autocapitalize="words" autocorrect="off">`).join("")}
      <button class="ob-add" onclick="obAddKin()">+ Kind hinzufügen</button>
      <div class="ob-h">Standard-Portionen pro Gericht</div>
      <div class="ob-stepper"><button class="ob-step-b" onclick="obPort(-1)">−</button><span class="ob-step-n">${obState.port}</span><button class="ob-step-b" onclick="obPort(1)">+</button></div>
      <div class="ob-spacer"></div>
      <button class="ob-btn" onclick="obFinish()">Los geht’s</button>
    </div>`;
  }
}
function obFinish(){
  const erw=obState.erw.map(x=>x.trim()).filter(Boolean);
  const kin=obState.kin.map(x=>x.trim()).filter(Boolean);
  if(!erw.length){alert("Bitte mindestens einen Namen für einen Erwachsenen eintragen.");return;}
  if(!kin.length){alert("Bitte mindestens ein Kind eintragen.");return;}
  const all=[...erw,...kin];
  if(new Set(all.map(n=>n.toLowerCase())).size!==all.length){alert("Bitte unterschiedliche Namen verwenden.");return;}
  cfg={erwachsene:erw,kinder:kin,portionen:obState.port};
  lsSet("cfg",cfg);
  applyConfig();
  const ov=document.getElementById("onboarding");if(ov)ov.remove();
  const st=document.getElementById("ob-style");if(st)st.remove();
  boot();
}

// ── Init ──
function boot(){
  if(!BEREICHE[bereich])bereich="start";
  const _btabs=BEREICHE[bereich].tabs;
  if(_btabs.length){if(!_btabs.some(t=>t.id===activeTab))activeTab=_btabs[0].id;}
  else activeTab=bereich;
  updatePill();
  document.getElementById("week-pill").style.display=(bereich==="essen")?"flex":"none";
  document.documentElement.setAttribute("data-bereich",bereich);
  document.getElementById("hdr-icon").innerHTML=areaSvg(bereich);
  document.getElementById("hdr-title").firstChild.textContent=BEREICHE[bereich].titel+" ";
  renderTabs();
  showTab(activeTab);
  atLoad().then(()=>{updatePill();renderActive();});
}
if(cfg){applyConfig();boot();}
else{startOnboarding();}
